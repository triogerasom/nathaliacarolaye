name: Casa & Obra - Diagnóstico de Produção

on:
  push:
    branches:
      - casa-obra-v4-sync
    paths:
      - ".github/workflows/casa-obra-production-test.yml"
      - "index.html"
      - "v5-*.js"
      - "v5-extra.js"
      - "v6.js"
      - "v5.css"
      - "sw.js"
      - "vercel.json"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnosticar produção
        shell: bash
        run: |
          set -u
          SITE="https://nathaliacarolaye.vercel.app"

          echo "=== HOME ==="
          HOME_CODE="$(curl -sS -L --max-time 20 -o /tmp/index.html -w "%{http_code}" "$SITE/")"
          echo "HTTP_HOME=$HOME_CODE"
          grep -o -m1 '<title>[^<]*</title>' /tmp/index.html || true
          if grep -q "Casa & Obra" /tmp/index.html; then echo "HOME_HAS_CASA_OBRA=YES"; else echo "HOME_HAS_CASA_OBRA=NO"; fi
          if grep -q "Dinheiro em mãos" /tmp/index.html; then echo "HOME_HAS_WALLET_FEATURE=YES"; else echo "HOME_HAS_WALLET_FEATURE=NO"; fi
          if grep -qi "Central Fiscal" /tmp/index.html; then echo "HOME_HAS_CENTRAL_FISCAL=YES"; else echo "HOME_HAS_CENTRAL_FISCAL=NO"; fi
          echo "HOME_BYTES=$(wc -c </tmp/index.html)"
          if grep -q "v5-0.js" /tmp/index.html; then echo "HOME_V5_LOADER=YES"; else echo "HOME_V5_LOADER=NO"; exit 1; fi
          if grep -q "v5.css" /tmp/index.html; then echo "HOME_V5_CSS=YES"; else echo "HOME_V5_CSS=NO"; exit 1; fi

          echo "=== V5 ASSETS ==="
          V5CSS_CODE="$(curl -sS -L --max-time 20 -o /tmp/v5.css -w "%{http_code}" "$SITE/v5.css")"
          echo "HTTP_V5_CSS=$V5CSS_CODE"
          grep -q "Casa & Obra V5" /tmp/v5.css
          : > /tmp/v5.js
          for n in 0 1 2 3 4; do
            CODE="$(curl -sS -L --max-time 20 -o "/tmp/v5-$n.js" -w "%{http_code}" "$SITE/v5-$n.js")"
            echo "HTTP_V5_PART_$n=$CODE"
            test "$CODE" = "200"
            cat "/tmp/v5-$n.js" >> /tmp/v5.js
          done
          EXTRA_CODE="$(curl -sS -L --max-time 20 -o /tmp/v5-extra.js -w "%{http_code}" "$SITE/v5-extra.js")"
          echo "HTTP_V5_EXTRA=$EXTRA_CODE"
          test "$EXTRA_CODE" = "200"
          node --check /tmp/v5-extra.js
          cat /tmp/v5-extra.js >> /tmp/v5.js
          node --check /tmp/v5.js
          grep -q "Casa & Obra V5" /tmp/v5.js
          grep -q "Cartões e faturas" /tmp/v5.js
          grep -q "Assistente financeiro" /tmp/v5.js
          grep -q "Projetos e centros" /tmp/v5.js
          grep -q "Documentos adicionais" /tmp/v5.js
          grep -q "Filtros avançados" /tmp/v5.js
          grep -q "Meus avisos" /tmp/v5.js
          echo "V5_BUNDLE_OK=YES"

          echo "=== V6 ACTIVE ASSETS ==="
          grep -q "v6-0.js" /tmp/index.html
          : > /tmp/v6.js
          for n in 0 1 2 3 4 5; do
            CODE="$(curl -sS -L --max-time 20 -o "/tmp/v6-$n.js" -w "%{http_code}" "$SITE/v6-$n.js")"
            echo "HTTP_V6_PART_$n=$CODE"
            test "$CODE" = "200"
            cat "/tmp/v6-$n.js" >> /tmp/v6.js
          done
          node --check /tmp/v6.js
          grep -q "Casa & Obra V6" /tmp/v6.js
          grep -q "rebuildFinancialState" /tmp/v6.js
          grep -q "appBackV6" /tmp/v6.js
          grep -q "dataEpoch" /tmp/v6.js
          echo "V6_ACTIVE_OK=YES"

          echo "=== CARD INVOICE FIX ==="
          CARDFIX_CODE="$(curl -sS -L --max-time 20 -o /tmp/cardfix.js -w "%{http_code}" "$SITE/cardfix.js")"
          echo "HTTP_CARDFIX=$CARDFIX_CODE"
          test "$CARDFIX_CODE" = "200"
          node --check /tmp/cardfix.js
          grep -q "syncCardInvoices" /tmp/cardfix.js
          grep -q "Conta bancária para débito da fatura" /tmp/cardfix.js
          grep -q "dueForInstallment" /tmp/cardfix.js
          grep -q "cardfix.js" /tmp/index.html
          echo "CARDFIX_OK=YES"

          echo "=== SIMPLIFIED UX ==="
          UX_CODE="$(curl -sS -L --max-time 20 -o /tmp/ux.js -w "%{http_code}" "$SITE/ux.js")"
          echo "HTTP_UX=$UX_CODE"
          test "$UX_CODE" = "200"
          node --check /tmp/ux.js
          grep -q "interface simplificada" /tmp/ux.js
          grep -q "Patrimônio e investimentos" /tmp/ux.js
          grep -q "Tudo organizado por área" /tmp/ux.js
          grep -q "ux.js" /tmp/index.html
          echo "UX_OK=YES"

          echo "=== MANIFEST ==="
          MANIFEST_CODE="$(curl -sS -L --max-time 20 -o /tmp/manifest.webmanifest -w "%{http_code}" "$SITE/manifest.webmanifest")"
          echo "HTTP_MANIFEST=$MANIFEST_CODE"
          if grep -q "Casa & Obra" /tmp/manifest.webmanifest; then echo "MANIFEST_CASA_OBRA=YES"; else echo "MANIFEST_CASA_OBRA=NO"; fi

          echo "=== FRONTEND SUPABASE CONFIG ==="
          CONFIG_CODE="$(curl -sS -L --max-time 20 -o /tmp/supabase-config.js -w "%{http_code}" "$SITE/supabase-config.js")"
          echo "HTTP_CONFIG=$CONFIG_CODE"
          if grep -q "djxuthfkhxaacdmhebld.supabase.co" /tmp/supabase-config.js; then echo "CONFIG_PROJECT_OK=YES"; else echo "CONFIG_PROJECT_OK=NO"; fi

          echo "=== EDGE FUNCTION ==="
          EDGE_CODE="$(curl -sS --max-time 20 -o /tmp/edge.json -w "%{http_code}" -X POST             "https://djxuthfkhxaacdmhebld.supabase.co/functions/v1/push-notify"             -H "Content-Type: application/json"             -d '{"mode":"vapid-key"}')"
          echo "HTTP_EDGE=$EDGE_CODE"
          if grep -q "publicKey" /tmp/edge.json; then echo "EDGE_PUBLIC_KEY=YES"; else echo "EDGE_PUBLIC_KEY=NO"; fi

          echo "=== DUE CHECK ==="
          DUE_CODE="$(curl -sS --max-time 20 -o /tmp/due.json -w "%{http_code}" -X POST             "https://djxuthfkhxaacdmhebld.supabase.co/functions/v1/push-notify"             -H "Content-Type: application/json"             -d '{"mode":"due"}')"
          echo "HTTP_DUE=$DUE_CODE"
          cat /tmp/due.json
          echo
