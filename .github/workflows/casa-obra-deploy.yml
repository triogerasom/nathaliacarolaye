name: Casa & Obra - Deploy Supabase

on:
  push:
    branches:
      - casa-obra-v4-sync
    paths:
      - "supabase/**"
      - "index.html"
      - "supabase-config.js"
      - ".github/workflows/casa-obra-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casa-obra-supabase-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout Casa & Obra branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Casa & Obra database migration via Management API
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dir = 'supabase/migrations';
          const files = fs.readdirSync(dir).filter(x => x.endsWith('.sql')).sort();
          const sql = files.map(name => '-- FILE: ' + name + '\n' + fs.readFileSync(dir + '/' + name, 'utf8')).join('\n\n');
          console.log('Migrations:', files.join(', '));
          const url = 'https://api.supabase.com/v1/projects/' + process.env.SUPABASE_PROJECT_ID + '/database/query';
          (async()=>{
            const res = await fetch(url,{
              method:'POST',
              headers:{
                'Authorization':'Bearer ' + process.env.SUPABASE_ACCESS_TOKEN,
                'Content-Type':'application/json'
              },
              body:JSON.stringify({query:sql})
            });
            const body = await res.text();
            if(!res.ok){ console.error('Migration failed:',res.status,body); process.exit(1); }
            console.log('All migrations applied successfully.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Store stable Web Push keypair in private database config
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const password = process.env.SUPABASE_DB_PASSWORD;
          const n = BigInt('0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551');
          const hash = crypto.createHash('sha256').update(password + '|casa-obra-vapid-v5').digest('hex');
          const d = (BigInt('0x' + hash) % (n - 1n)) + 1n;
          const priv = Buffer.from(d.toString(16).padStart(64,'0'),'hex');
          const ecdh = crypto.createECDH('prime256v1');
          ecdh.setPrivateKey(priv);
          const pub = ecdh.getPublicKey(null,'uncompressed');
          const enc = b => b.toString('base64').replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
          const publicKey = enc(pub), privateKey = enc(priv);
          const reminderToken = crypto.createHash('sha256').update(password + '|casa-obra-reminder-v1').digest('hex');
          const esc = s => s.replace(/'/g,"''");
          const query = `insert into public.backend_runtime_config(name,config_value,updated_at) values
            ('vapid_public','${esc(publicKey)}',now()),
            ('vapid_private','${esc(privateKey)}',now()),
            ('reminder_token','${esc(reminderToken)}',now())
            on conflict (name) do update set config_value=excluded.config_value, updated_at=now();`;
          const url='https://api.supabase.com/v1/projects/'+process.env.SUPABASE_PROJECT_ID+'/database/query';
          (async()=>{
            const res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.SUPABASE_ACCESS_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({query})});
            if(!res.ok){console.error('Web Push config failed:',res.status,await res.text());process.exit(1)}
            console.log('Web Push backend key configured.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy push notification function
        run: supabase functions deploy push-notify --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Smoke test Edge Function
        run: |
          node <<'NODE'
          (async()=>{
            const url='https://' + process.env.SUPABASE_PROJECT_ID + '.supabase.co/functions/v1/push-notify';
            const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'vapid-key'}),signal:AbortSignal.timeout(15000)});
            const data=await res.json().catch(()=>({}));
            if(!res.ok || !data.publicKey){console.error('Smoke test failed',res.status,data);process.exit(1)}
            console.log('Edge Function is online.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
