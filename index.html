<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa & Obra – Finanças</title>
<meta name="theme-color" content="#1f6fe5">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./v5.css">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#14231c;--mu:#6b7a72;--ln:#e3e8e5;--g:#0e9f6e;--r:#e04a4a;--b:#2f6fed;--o:#e8890c;--hd:#1f6fe5;--rb:#fdecec;--td:#d93636;--ok2:#0b8a5f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--tx:#e8f0eb;--mu:#8fa398;--ln:#263630;--g:#2fcf97;--r:#ff7070;--b:#6b9bff;--o:#ffb04d;--hd:#17408f;--rb:#3a1f1f;--td:#a82a2a;--ok2:#0a6a49}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--tx:#e8f0eb;--mu:#8fa398;--ln:#263630;--g:#2fcf97;--r:#ff7070;--b:#6b9bff;--o:#ffb04d;--hd:#17408f;--rb:#3a1f1f;--td:#a82a2a;--ok2:#0a6a49}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;max-width:520px;margin:0 auto;min-height:100vh}
.hd{background:var(--hd);color:#fff;padding:18px 18px 56px;border-radius:0 0 26px 26px}
.hd small{opacity:.8}.hd h1{margin:2px 0 0;font-size:30px;font-weight:700;letter-spacing:-.5px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mn button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:16px}
.mn span{text-transform:capitalize;font-weight:600}
main{padding:0 14px 110px;margin-top:-38px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.in{color:var(--g)}.out{color:var(--r)}.mu{color:var(--mu)}
h2{font-size:15px;margin:4px 0 10px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.it:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.it .t{flex:1;min-width:0}.it .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t span{font-size:12px}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--g);border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;min-width:0;padding:6px 0}
.nav button b{display:block;font-size:20px;font-weight:400}.nav .on{color:var(--b);font-weight:700}
.fs{flex:0 0 58px;display:flex;justify-content:center}.nav .fab{flex:none;margin-top:-28px;width:56px;height:56px;border-radius:50%;background:var(--b);color:#fff;font-size:30px;padding:0;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.today{background:var(--td);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}.today.clear{background:var(--ok2)}
.today small{font-size:14px;font-weight:600;opacity:.92}.tv{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:2px 0}
.today .it{border-color:rgba(255,255,255,.28)}.today .ic{background:rgba(255,255,255,.2)}.today .mu{color:rgba(255,255,255,.85)}.today .ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.pd{opacity:.55}.pd .t b{text-decoration:line-through}
.dh{display:flex;justify-content:space-between;padding:10px 0 2px;border-top:1px solid var(--ln)}.dh:first-of-type{border-top:0}
.ar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}.ar.in{background:var(--g);color:#fff}.ar.out{background:var(--r);color:#fff}
.hd.sl{padding-bottom:50px}.ttl{font-size:20px;font-weight:700;display:block;margin-bottom:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--ln);margin-bottom:4px}.sum b{display:block;font-size:17px}.sum .mu{font-size:12px;display:block}.si{font-size:22px;opacity:.7}
.dy{font-weight:700;margin:16px 0 4px}.dy em{font-style:normal;font-size:11px;font-weight:600;background:var(--hd);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px}
.tr{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}.tr .ic{width:42px;height:42px;font-size:20px}
.tr .t{flex:1;min-width:0}.tr .t b{display:block;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr .t span{font-size:12px}
.am{text-align:right}.am>b{font-size:15px}.st{display:flex;gap:5px;justify-content:flex-end;align-items:center;margin-top:4px}
.s{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;color:#fff}.s.dn{background:#1e8e3e}.s.pn{background:#1c8a8a}.s2{font-style:normal;font-size:13px}
.big2{font-size:28px;font-weight:800;margin:6px 0 2px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cg i{font-style:normal;font-size:12px;color:var(--mu);padding:4px 0}
.cd{border:0;background:none;color:var(--tx);font:inherit;padding:6px 0 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;min-height:44px}
.cd span{display:flex;gap:3px;height:6px;margin-top:3px}.cd.td2{font-weight:800;color:var(--b)}.cd.sl2{background:var(--b);color:#fff}
u.d1,u.d2{display:inline-block;width:6px;height:6px;border-radius:50%;text-decoration:none}u.d1{background:var(--b)}u.d2{background:var(--r)}.cd.sl2 u.d1{background:#fff}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:10px;justify-content:center}.lg u{margin-right:4px;vertical-align:middle}
.ag{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;border-radius:12px;background:var(--bg);border-left:4px solid var(--b);cursor:pointer}
.ag .hh{width:46px;font-weight:700;color:var(--b);font-size:13px;line-height:1.1}.ag .t{flex:1;min-width:0}.ag .t b{display:block}.ag .t span{font-size:12px}
.wa{background:#25d366;color:#fff;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.vc{color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.vc .tv{margin:0}.vb{flex:1;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:9px;font:inherit;font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:10px;font:inherit;font-weight:600}
.seg .on{background:var(--bg);color:var(--tx)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.md.show{display:flex}
.sh{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
.sh input,.sh select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.pri{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:700}
.ghost{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit}
.emp{text-align:center;padding:18px 8px}
.alert{background:var(--rb);border:1px solid var(--r);border-radius:16px;padding:14px;margin-bottom:12px}
.ok{border-color:var(--g);background:var(--card)}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{padding:7px 3px;text-align:right;border-top:1px solid var(--ln)}
.tb th{font-weight:600;color:var(--mu);border:0}.tb td:first-child,.tb th:first-child{text-align:left}
.tb tr.tot td{font-weight:700}

/* PWA / UX */
.appsec{margin-top:12px}.appgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.appstat{padding:10px 12px;background:var(--bg);border-radius:12px}.appstat span{display:block;font-size:11px;color:var(--mu)}.appstat b{display:block;margin-top:2px;font-size:13px}.appactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.appactions .ghost,.appactions .pri{margin:0;width:100%;min-height:42px}.appactions .wide{grid-column:1/-1}.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:4px 8px;background:var(--bg);color:var(--mu)}.badge.okb{color:var(--g)}.badge.warnb{color:var(--o)}.pwa-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:492px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.24);padding:12px;z-index:8;display:none}.pwa-banner.show{display:block}.pwa-banner .row{align-items:flex-start}.pwa-banner b{display:block}.pwa-banner small{display:block;color:var(--mu);margin-top:2px}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-12px);width:calc(100% - 28px);max-width:492px;background:var(--tx);color:var(--card);padding:11px 14px;border-radius:12px;z-index:20;opacity:0;pointer-events:none;transition:.22s ease;box-shadow:0 10px 30px rgba(0,0,0,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}.offline-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:5px}.offline-dot.off{background:var(--r)}.install-hint{font-size:12px;color:var(--mu);line-height:1.45;margin-top:8px}
@media(max-width:370px){.appgrid,.appactions{grid-template-columns:1fr}.appactions .wide{grid-column:auto}}


/* Supabase Auth + nuvem */
.auth-gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at top right,rgba(47,111,237,.18),transparent 36%),
linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 88%,var(--b) 12%))}
.auth-box{width:min(430px,100%);background:var(--card);border:1px solid var(--ln);border-radius:26px;padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.14)}
.auth-logo{width:64px;height:64px;border-radius:18px;background:var(--hd);display:grid;place-items:center;color:#fff;font-size:30px;box-shadow:0 10px 28px rgba(31,111,229,.28)}
.auth-box h1{font-size:27px;margin:18px 0 5px;letter-spacing:-.5px}.auth-box p{color:var(--mu);margin:0 0 18px}
.google-btn{width:100%;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:13px 15px;border-radius:13px;font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.google-g{font-family:Arial,sans-serif;font-weight:900;color:#4285f4;font-size:20px}
.auth-note{font-size:12px;color:var(--mu);margin-top:14px;line-height:1.5}
.cloud-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 8px;border-radius:999px;background:var(--bg);color:var(--mu)}
.cloud-pill.ok{background:#e8f7f1;color:#08724d}.cloud-pill.err{background:#fdecec;color:#b42626}

</style>
</head>
<body>
<div id="app"></div>
<div class="md" id="md"><div class="sh" id="sh"></div></div>
<div class="nav" id="nav"></div>
<div class="pwa-banner" id="pwaBanner" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const CAT={casa:['Moradia','Mercado','Transporte','Saúde','Lazer','Educação','Contas','Salário','Outros'],
obra:['Fundação','Alvenaria','Cobertura','Elétrica','Hidráulica','Acabamento','Mão de obra','Projetos e taxas','Outros']};
const ALL=[...new Set([...CAT.casa,...CAT.obra])];
const IC={Moradia:'🏠',Mercado:'🛒',Transporte:'🚗',Saúde:'💊',Lazer:'🎉',Educação:'📚',Contas:'💡',Salário:'💰',Outros:'📦',Fundação:'🧱',Alvenaria:'🏗️',Cobertura:'🏘️',Elétrica:'⚡',Hidráulica:'🚰',Acabamento:'🎨','Mão de obra':'👷','Projetos e taxas':'📐'};
const FL={m:'mensal',w:'semanal',a:'anual'};
const REP={o:['Uma vez (ou lançamento futuro)'],fm:['Fixa mensal','m','Fixa'],em:['Mensal estimada','m','Estimada'],sw:['Semanal','w','Estimada'],an:['Anual','a','Fixa']};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TD=ymd(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
let S={tx:[],budget:0,obraIni:0,obraDt:'',acc:[],rec:[],pd:{},paypost:{},cash:0,cashlog:[],alog:[],ev:[],vr:[],vlog:[],_deleted:{tx:{},rec:{},acc:{},ev:{},vr:{},pd:{},paypost:{}},_fieldUpdated:{}},tab='home',rs='casa',rm='m',hz=90,month=TD.slice(0,7),sel=TD,md={type:'out',scope:'casa'};
try{const d=JSON.parse(localStorage.getItem('fin')||'null');if(d&&d.tx)S=Object.assign(S,d)}catch(e){}
try{const q=new URLSearchParams(location.search),qt=q.get('tab');if(['home','agenda','casa','obra','mais','prev','contas','vr','rel'].includes(qt))tab=qt}catch(e){}
function save(){
 try{localStorage.setItem('fin',JSON.stringify(S));localStorage.setItem('cloud_dirty','1')}catch(e){}
 CLOUD_DIRTY=true;cloudScheduleSave();
}
const $=s=>document.querySelector(s);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pv=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));
const sum=a=>a.reduce((t,x)=>t+x.val,0);
const fd=d=>d.split('-').reverse().slice(0,2).join('/');
const fdy=d=>{const[y,m,x]=d.split('-');return x+'/'+m+'/'+y.slice(2)};
const mname=m=>new Date(m+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const accTotal=()=>sum(S.acc.filter(a=>a.inc!==false))+Number(S.cash||0);
function occ(r,a,b){const o=[],e=r.end&&r.end<b?r.end:b,sd=+r.start.slice(8),sm=+r.start.slice(5,7);
 for(let d=a>r.start?a:r.start;d<=e;d=addD(d,1)){const[y,m,dd]=d.split('-').map(Number);let ok;
  if(r.freq==='w')ok=Math.round((new Date(d)-new Date(r.start))/864e5)%7===0;
  else{const t=Math.min(sd,new Date(y,m,0).getDate());ok=dd===t&&(r.freq==='m'||m===sm)}
  if(ok)o.push(d)}return o}
function events(a,b){const L=S.tx.filter(x=>x.date>=a&&x.date<=b);
 S.rec.forEach(r=>occ(r,a,b).forEach(d=>L.push({...r,id:'r'+r.id,date:d,rec:1})));
 return L.sort((x,y)=>y.date.localeCompare(x.date))}
const evSc=(sc,a,b)=>events(a,b).filter(x=>sc==='all'||x.scope===sc);
const mEv=(sc,m)=>evSc(sc,m+'-01',m+'-31');
const inc=l=>sum(l.filter(x=>x.type==='in')),exp=l=>sum(l.filter(x=>x.type==='out'));
function item(x){const fut=x.date>TD;
 return `<div class="it"><div class="ic">${IC[x.cat]||'📦'}</div><div class="t"><b>${esc(x.desc)}</b><span class="mu">${x.cat}${x.sup?' · '+esc(x.sup):''}${x.walletKey?' · '+esc(walletLabel(x)):''} · ${fd(x.date)}${x.rec?' · 🔁 '+FL[x.freq]+' '+x.kind.toLowerCase():fut?' · agendado':''}</span></div><b class="${x.type==='in'?'in':'out'}">${x.type==='in'?'+':'−'}${brl(x.val)}</b>${x.att?`<button class="x" onclick="viewAtt('${x.id}')" aria-label="Ver comprovante">📎</button>`:''}${x.rec?'':`<button class="x" onclick="del('${x.id}')" aria-label="Excluir">×</button>`}</div>`}
function monthBar(){return `<div class="mn"><button onclick="mv(-1)">‹</button><span>${mname(month)}</span><button onclick="mv(1)">›</button></div>`}
function yearBar(){return `<div class="mn"><button onclick="mv(-12)">‹</button><span>${month.slice(0,4)}</span><button onclick="mv(12)">›</button></div>`}
function mv(n){const d=new Date(month+'-15');d.setMonth(d.getMonth()+n);month=ymd(d).slice(0,7);sel=month===TD.slice(0,7)?TD:month+'-01';render()}
function del(id){const x=S.tx.find(t=>t.id===id);if(x){const k=id+'|'+x.date;if(S.pd[k]){if(!reversePayment(k))return;delete S.pd[k];tomb('pd',k)}}tomb('tx',id);S.tx=S.tx.filter(x=>x.id!==id);try{localStorage.removeItem('fatt_'+id)}catch(e){}cloudDeleteAttachment(id);save();render()}
function bars(list,cats){
 const t=cats.map(c=>[c,sum(list.filter(x=>x.cat===c&&x.type==='out'))]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]);
 if(!t.length)return '<div class="emp mu">Sem despesas neste período.</div>';
 return t.map(([c,v])=>`<div style="margin:10px 0"><div class="row sp"><span>${IC[c]||''} ${c}</span><b>${brl(v)}</b></div><div class="bar"><i style="width:${v/t[0][1]*100}%;background:var(--b)"></i></div></div>`).join('')}
function forecast(n){let bal=accTotal();const start=bal,by={},days=[];
 events(addD(TD,1),addD(TD,n)).forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
 for(let i=1;i<=n;i++){const d=addD(TD,i);(by[d]||[]).forEach(e=>bal+=e.type==='in'?e.val:-e.val);days.push({d,bal})}
 const neg=[];let c=null;days.forEach(x=>{if(x.bal<0){if(!c){c={a:x.d,b:x.d,n:0,min:x.bal};neg.push(c)}c.b=x.d;c.n++;c.min=Math.min(c.min,x.bal)}else c=null});
 return{start,days,neg}}
function chart(pts){const W=340,H=130,P=6,v=pts.map(p=>p.bal),mn=Math.min(0,...v),mx=Math.max(0,...v),rg=(mx-mn)||1;
 const X=i=>P+i*(W-2*P)/(pts.length-1||1),Y=b=>P+(mx-b)*(H-2*P)/rg,z=Y(0).toFixed(1);
 const pl=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.bal).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico do saldo previsto"><defs><clipPath id="cu"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath><clipPath id="cd"><rect x="0" y="${z}" width="${W}" height="${H}"/></clipPath></defs><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--mu)" stroke-dasharray="3 3"/><polyline points="${pl}" fill="none" stroke="var(--g)" stroke-width="2.2" clip-path="url(#cu)"/><polyline points="${pl}" fill="none" stroke="var(--r)" stroke-width="2.2" clip-path="url(#cd)"/></svg>`}
function render(){
 const A=$('#app');let h='';

  <div class="card"><h2>Próximos lançamentos</h2>${dayList(up,1,1)||'<div class="emp mu">Nada agendado. Toque em + e escolha uma repetição ou uma data futura.</div>'}</div>
  <div class="card"><h2>Receitas e despesas recorrentes</h2>${S.rec.map(r=>`<div class="it"><div class="ic">${IC[r.cat]||'🔁'}</div><div class="t"><b>${esc(r.desc)}</b><span class="mu">${FL[r.freq]} · ${r.kind.toLowerCase()} · desde ${fd(r.start)}</span></div><b class="${r.type==='in'?'in':'out'}">${r.type==='in'?'+':'−'}${brl(r.val)}</b><button class="x" onclick="delRec('${r.id}')" aria-label="Excluir">×</button></div>`).join('')||'<div class="emp mu">Nenhuma recorrência cadastrada.</div>'}<div class="mu" style="font-size:12px;margin-top:6px">Recorrências entram sozinhas nos saldos e relatórios desde a data de início. Não lance de novo o mesmo valor.</div></div></main>`}
 if(tab==='rel'){

  if(rm==='m'){const l=mEv(sc,month);
   h=`<div class="hd">${monthBar()}<small>Balanço do mês</small><h1 class="${inc(l)-exp(l)<0?'':''}">${brl(inc(l)-exp(l))}</h1></div><main>${tabs}<div class="card g2"><div><span class="mu">Receitas</span><div class="in"><b>${brl(inc(l))}</b></div></div><div><span class="mu">Despesas</span><div class="out"><b>${brl(exp(l))}</b></div></div></div><div class="card"><h2>Despesas por categoria</h2>${bars(l,cats)}</div></main>`}
  else{const y=month.slice(0,4),l=evSc(sc,y+'-01-01',y+'-12-31');
   const rows=Array.from({length:12},(_,i)=>{const m=y+'-'+String(i+1).padStart(2,'0'),a=l.filter(x=>x.date.startsWith(m));return{m,i:inc(a),e:exp(a)}});
   h=`<div class="hd">${yearBar()}<small>Balanço do ano</small><h1>${brl(inc(l)-exp(l))}</h1></div><main>${tabs}<div class="card"><table class="tb"><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th></tr>${rows.map(r=>`<tr><td>${new Date(r.m+'-15').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</td><td class="in">${brl(r.i)}</td><td class="out">${brl(r.e)}</td><td class="${r.i-r.e<0?'out':''}"><b>${brl(r.i-r.e)}</b></td></tr>`).join('')}<tr class="tot"><td>Ano</td><td class="in">${brl(inc(l))}</td><td class="out">${brl(exp(l))}</td><td>${brl(inc(l)-exp(l))}</td></tr></table></div><div class="card"><h2>Despesas por categoria</h2>${bars(l,cats)}</div></main>`}}
 A.innerHTML=h}
const CC={Moradia:'#7c4dff',Mercado:'#ef8a17',Transporte:'#2f6fed',Saúde:'#2fb36b',Lazer:'#1fa971',Educação:'#9c27b0',Contas:'#f4b400',Salário:'#1e8e3e',Outros:'#78909c',Fundação:'#8d6e63',Alvenaria:'#d4651a',Cobertura:'#c0392b',Elétrica:'#f2a900',Hidráulica:'#0aa5d8',Acabamento:'#e91e8c','Mão de obra':'#455a64','Projetos e taxas':'#3f51b5'};
function summ(b){const a=accTotal();return `<div class="sum"><div class="row"><span class="si">🏦</span><div><span class="mu">Saldo atual</span><b class="${a<0?'out':'in'}">${brl(a)}</b></div></div><div class="row"><span class="si">⚖️</span><div><span class="mu">Balanço mensal</span><b class="${b<0?'out':'in'}">${brl(b)}</b></div></div></div>`}
function row2(x){const k=pdk(x),done=S.pd[k]||x.date<TD||(x.date===TD&&x.type==='in');
 return `<div class="tr" onclick="openTx('${k}')"><div class="ic" style="background:${CC[x.cat]||'#78909c'}">${IC[x.cat]||'📦'}</div><div class="t"><b>${esc(x.desc)}</b><span class="mu">${x.cat}${x.sup?' | '+esc(x.sup):''}${x.scope==='obra'?' | Obra':''}${x.walletKey?' | '+walletLabel(x):''}${x.pay?' | '+x.pay:''}${x.rec?' | 🔁 '+FL[x.freq]:''}</span></div><div class="am"><b class="${x.type==='in'?'in':'out'}">${brl(x.val)}</b><div class="st">${x.att?'<i class="s2">📎</i>':''}<i class="s ${done?'dn':'pn'}"${x.date>=TD?` onclick="event.stopPropagation();pay('${k}')"`:''}>${done?'✓':'⏱'}</i></div></div></div>`}
function dayList(L,asc,wm){const days=[...new Set(L.map(e=>e.date))].sort();if(!asc)days.reverse();
 return days.map(d=>{const dt=new Date(d+'T12:00:00'),w=dt.toLocaleDateString('pt-BR',{weekday:'long'});
  return `<div class="dy">${w.charAt(0).toUpperCase()+w.slice(1)}, ${String(dt.getDate()).padStart(2,'0')}${wm?' '+dt.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''):''}${d===TD?'<em>hoje</em>':''}</div>`+L.filter(e=>e.date===d).map(row2).join('')}).join('')}

function ensureStateShape(x=S){
 x.tx=Array.isArray(x.tx)?x.tx:[];x.rec=Array.isArray(x.rec)?x.rec:[];x.acc=Array.isArray(x.acc)?x.acc:[];x.ev=Array.isArray(x.ev)?x.ev:[];x.vr=Array.isArray(x.vr)?x.vr:[];
 x.alog=Array.isArray(x.alog)?x.alog:[];x.vlog=Array.isArray(x.vlog)?x.vlog:[];x.cashlog=Array.isArray(x.cashlog)?x.cashlog:[];x.pd=x.pd||{};x.paypost=x.paypost||{};x.cash=Number(x.cash||0);
 x._deleted=x._deleted||{};['tx','rec','acc','ev','vr','pd','paypost'].forEach(k=>x._deleted[k]=x._deleted[k]||{});x._fieldUpdated=x._fieldUpdated||{};return x
}
const stamp=o=>(o&&(o._u=Date.now()),o);
function tomb(bucket,id){ensureStateShape();S._deleted[bucket][String(id)]=Date.now()}
function clearTomb(bucket,id){ensureStateShape();delete S._deleted[bucket][String(id)]}
function fieldStamp(name){ensureStateShape();S._fieldUpdated[name]=Date.now()}
function walletLabel(x){const k=typeof x==='string'?x:x?.walletKey;if(!k)return 'Não informado';if(k==='cash')return 'Dinheiro em mãos';if(k.startsWith('acc:')){const a=S.acc.find(v=>v.id===k.slice(4));return a?'Conta · '+a.name:'Conta bancária'}if(k.startsWith('vr:')){const v=S.vr.find(v=>v.id===k.slice(3));return v?'VR · '+v.brand+(v.nick?' · '+v.nick:''):'Vale-refeição'}return 'Não informado'}
function walletOptions(ed){const cur=ed?.walletKey||'';let h='<option value="">Selecione...</option>';h+=S.acc.map(a=>`<option value="acc:${a.id}"${cur===`acc:${a.id}`?' selected':''}>🏦 ${esc(a.name)} · ${brl(a.val)}</option>`).join('');h+=S.vr.map(v=>`<option value="vr:${v.id}"${cur===`vr:${v.id}`?' selected':''}>🍽️ ${v.brand}${v.nick?' · '+esc(v.nick):''} · ${brl(v.val)}</option>`).join('');h+=`<option value="cash"${cur==='cash'?' selected':''}>💵 Dinheiro em mãos · ${brl(S.cash||0)}</option>`;return h}
function walletField(ed,type){return `<label>${type==='out'?'Debitar de':'Creditar em'}</label><select id="f12">${walletOptions(ed)}</select><div class="mu" style="font-size:12px;margin-top:4px">O saldo só será movimentado quando marcar como ${type==='out'?'pago':'recebido'}.</div>`}
function walletApply(walletKey,delta,note){if(!walletKey)return false;if(walletKey==='cash'){S.cash=Math.round((Number(S.cash||0)+delta)*100)/100;S.cashlog.unshift({id:Date.now()+Math.random().toString(36).slice(2),d:TD,v:delta,n:note,_u:Date.now()});S.cashlog=S.cashlog.slice(0,80);fieldStamp('cash');return true}if(walletKey.startsWith('acc:')){const a=S.acc.find(x=>x.id===walletKey.slice(4));if(!a)return false;a.val=Math.round((Number(a.val||0)+delta)*100)/100;stamp(a);logA(a.name,delta,note);return true}if(walletKey.startsWith('vr:')){const v=S.vr.find(x=>x.id===walletKey.slice(3));if(!v)return false;if(delta<0&&v.val+delta<-.001){toast('Saldo insuficiente no VR selecionado.');return false}v.val=Math.round((Number(v.val||0)+delta)*100)/100;stamp(v);logV(v,delta,note);return true}return false}
function postPayment(k,x){ensureStateShape();if(S.paypost[k])return true;const delta=x.type==='out'?-Number(x.val):Number(x.val);if(!walletApply(x.walletKey,delta,(x.type==='out'?'Pagamento: ':'Recebimento: ')+x.desc))return false;S.paypost[k]={walletKey:x.walletKey,delta,desc:x.desc,_u:Date.now()};clearTomb('paypost',k);return true}
function reversePayment(k){ensureStateShape();const p=S.paypost[k];if(!p)return true;if(!walletApply(p.walletKey,-Number(p.delta||0),'Estorno: '+(p.desc||'lançamento')))return false;delete S.paypost[k];tomb('paypost',k);return true}
function openCash(){M(`<h2>Dinheiro em mãos</h2><label>Saldo atual (R$)</label><input id="f1" inputmode="decimal" value="${String(S.cash||0).replace('.',',')}"><div id="er" class="out"></div><button class="pri" onclick="saveCash()">Salvar saldo</button>${btns()}`)}
function saveCash(){const v=pv($('#f1').value||'0');if(isNaN(v)){$('#er').textContent='Informe um saldo válido.';return}const df=Math.round((v-Number(S.cash||0))*100)/100;S.cash=v;fieldStamp('cash');if(df)S.cashlog.unshift({id:Date.now()+'',d:TD,v:df,n:'Ajuste de dinheiro em mãos',_u:Date.now()});save();closeM();render()}

function openTx(k){const[id,d]=k.split('|'),rec=S.rec.find(r=>'r'+r.id===id),x=rec?{...rec,date:d}:S.tx.find(t=>t.id===id);if(!x)return;

function itemMap(list){return new Map((list||[]).map(x=>[String(x.id),x]))}
function deletedAt(st,b,id){return Number(st?._deleted?.[b]?.[String(id)]||0)}
function mergeList(name,a,b){const A=itemMap(a?.[name]),B=itemMap(b?.[name]),ids=new Set([...A.keys(),...B.keys(),...Object.keys(a?._deleted?.[name]||{}),...Object.keys(b?._deleted?.[name]||{})]),out=[];for(const id of ids){const x=A.get(id),y=B.get(id),dx=deletedAt(a,name,id),dy=deletedAt(b,name,id),del=Math.max(dx,dy),ux=Number(x?._u||0),uy=Number(y?._u||0),pick=ux>=uy?x:y;if(pick&&Number(pick._u||0)>=del)out.push(pick)}return out}
function mergeKeyed(name,a,b){const ax=a?.[name]||{},bx=b?.[name]||{},ids=new Set([...Object.keys(ax),...Object.keys(bx),...Object.keys(a?._deleted?.[name]||{}),...Object.keys(b?._deleted?.[name]||{})]),out={};for(const id of ids){const x=ax[id],y=bx[id],dx=deletedAt(a,name,id),dy=deletedAt(b,name,id),del=Math.max(dx,dy),ux=Number(x?._u||0),uy=Number(y?._u||0),pick=ux>=uy?x:y;if(pick&&Math.max(ux,uy)>=del)out[id]=pick}return out}
function mergeLog(a,b,name){const m=new Map();[...(a?.[name]||[]),...(b?.[name]||[])].forEach(x=>{const id=String(x.id||[x.d,x.a,x.v,x.n].join('|'));const cur=m.get(id);if(!cur||Number(x._u||0)>=Number(cur._u||0))m.set(id,x)});return [...m.values()].sort((x,y)=>Number(y._u||0)-Number(x._u||0)).slice(0,80)}
function mergeState(a0,b0){const a=ensureStateShape(structuredClone(a0||{})),b=ensureStateShape(structuredClone(b0||{})),o=ensureStateShape({});['tx','rec','acc','ev','vr'].forEach(k=>o[k]=mergeList(k,a,b));o.pd=mergeKeyed('pd',a,b);o.paypost=mergeKeyed('paypost',a,b);['alog','vlog','cashlog'].forEach(k=>o[k]=mergeLog(a,b,k));o._deleted={};['tx','rec','acc','ev','vr','pd','paypost'].forEach(k=>o._deleted[k]={...(a._deleted[k]||{}),...(b._deleted[k]||{})});o._fieldUpdated={...(a._fieldUpdated||{}),...(b._fieldUpdated||{})};['budget','obraIni','obraDt','cash'].forEach(k=>{const ta=Number(a._fieldUpdated?.[k]||0),tb=Number(b._fieldUpdated?.[k]||0);o[k]=ta>=tb?a[k]:b[k];o._fieldUpdated[k]=Math.max(ta,tb)});return o}
async function handleSession(session){if(!session?.user){CLOUD_USER=null;CLOUD_READY=false;showAuthGate();return}const email=String(session.user.email||'').toLowerCase();if(!ALLOWED_EMAILS.includes(email)){try{await SB.auth.signOut()}catch(e){}CLOUD_USER=null;CLOUD_READY=false;showAuthGate('Esta conta Google não possui acesso.');return}CLOUD_USER=session.user;await cloudLoadState();await cloudMigrateLocalAttachments();await ensurePushSubscription();cloudSubscribe();const N=$('#nav');if(N)N.style.display='flex';render();setTimeout(dailyReminders,900)}
async function bootstrapApp(){restoreTheme();registerSW();if(!hasCloudConfig()||!window.supabase){showConfigGate();return}try{SB=window.supabase.createClient(window.APP_CONFIG.supabaseUrl,window.APP_CONFIG.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session},error}=await SB.auth.getSession();if(error)throw error;SB.auth.onAuthStateChange((_event,s)=>setTimeout(()=>handleSession(s),0));await handleSession(session)}catch(e){showAuthGate('Falha ao conectar ao Supabase: '+(e?.message||e))}}
async function cloudFetch(){return await SB.from('app_state').select('data,revision,updated_at,updated_by,device_id').eq('id',CLOUD_ROW_ID).maybeSingle()}
async function cloudLoadState(){if(!SB||!CLOUD_USER)return;CLOUD_STATUS='Baixando dados…';const {data,error}=await cloudFetch();if(error){CLOUD_STATUS='Erro de sincronização';return}const localDirty=localStorage.getItem('cloud_dirty')==='1';if(data?.data){CLOUD_REV=Number(data.revision||0);const remote=ensureStateShape(data.data);S=localDirty?mergeState(S,remote):remote;try{localStorage.setItem('fin',JSON.stringify(S));localStorage.setItem('cloud_revision',String(CLOUD_REV))}catch(e){}}else{ensureStateShape(S);const {data:created,error:upErr}=await SB.from('app_state').upsert({id:CLOUD_ROW_ID,data:S,revision:1,updated_by:CLOUD_USER.id,device_id:DEVICE_ID},{onConflict:'id'}).select('revision').single();if(upErr){CLOUD_STATUS='Erro ao criar dados';return}CLOUD_REV=Number(created.revision||1)}CLOUD_DIRTY=localDirty;CLOUD_READY=true;CLOUD_STATUS=CLOUD_DIRTY?'Alterações locais pendentes':'Sincronizado';if(CLOUD_DIRTY)cloudScheduleSave()}
function cloudScheduleSave(){if(CLOUD_APPLYING||!CLOUD_READY||!SB||!CLOUD_USER)return;CLOUD_DIRTY=true;CLOUD_STATUS='Salvando…';clearTimeout(CLOUD_SAVE_TIMER);CLOUD_SAVE_TIMER=setTimeout(()=>cloudPushState(0),500)}
async function cloudPushState(attempt=0){if(!SB||!CLOUD_USER||CLOUD_APPLYING||CLOUD_PUSHING)return;CLOUD_PUSHING=true;try{ensureStateShape(S);const next=CLOUD_REV+1,{data,error}=await SB.from('app_state').update({data:S,revision:next,updated_by:CLOUD_USER.id,device_id:DEVICE_ID}).eq('id',CLOUD_ROW_ID).eq('revision',CLOUD_REV).select('revision').maybeSingle();if(error)throw error;if(data){CLOUD_REV=Number(data.revision);CLOUD_DIRTY=false;CLOUD_STATUS='Sincronizado';localStorage.setItem('cloud_dirty','0');localStorage.setItem('cloud_revision',String(CLOUD_REV));return}if(attempt<2){const r=await cloudFetch();if(r.error)throw r.error;if(r.data){CLOUD_APPLYING=true;S=mergeState(S,r.data.data);CLOUD_APPLYING=false;CLOUD_REV=Number(r.data.revision||0);localStorage.setItem('fin',JSON.stringify(S));CLOUD_DIRTY=true;CLOUD_STATUS='Mesclando alterações…'}CLOUD_PUSHING=false;return cloudPushState(attempt+1)}throw new Error('Conflito de sincronização não resolvido')}catch(e){console.error(e);CLOUD_STATUS='Pendente · tentará novamente';CLOUD_DIRTY=true;localStorage.setItem('cloud_dirty','1')}finally{CLOUD_PUSHING=false;if(tab==='mais')render()}}
async function cloudSyncNow(){if(!SB||!CLOUD_USER)return;await cloudPushState();const r=await cloudFetch();if(r.data&&Number(r.data.revision||0)>CLOUD_REV){CLOUD_APPLYING=true;S=mergeState(S,r.data.data);CLOUD_APPLYING=false;CLOUD_REV=Number(r.data.revision||0);localStorage.setItem('fin',JSON.stringify(S))}render();toast(CLOUD_STATUS==='Sincronizado'?'Sincronização concluída.':'Alterações preservadas e pendentes de sincronização.')}
function cloudSubscribe(){if(!SB||CLOUD_CHANNEL)return;CLOUD_CHANNEL=SB.channel('casa-obra-state-v4').on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_state',filter:`id=eq.${CLOUD_ROW_ID}`},payload=>{const row=payload.new,rev=Number(row?.revision||0);if(!row?.data||rev<=CLOUD_REV)return;CLOUD_APPLYING=true;S=mergeState(S,row.data);CLOUD_APPLYING=false;CLOUD_REV=rev;localStorage.setItem('fin',JSON.stringify(S));localStorage.setItem('cloud_revision',String(rev));if(CLOUD_DIRTY)cloudScheduleSave();else CLOUD_STATUS='Atualizado da nuvem';render()}).subscribe()}
function dataUrlToBlob(dataUrl){const [head,body]=String(dataUrl).split(','),mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream',bytes=atob(body||''),a=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)a[i]=bytes.charCodeAt(i);return new Blob([a],{type:mime})}
function blobToDataURL(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}
async function cloudUploadAttachment(id,dataUrl){if(!SB||!CLOUD_USER||!dataUrl)return;try{const blob=dataUrlToBlob(dataUrl);await SB.storage.from('receipts').upload('shared/'+id,blob,{upsert:true,contentType:blob.type})}catch(e){console.warn('Upload comprovante:',e)}}
async function cloudDeleteAttachment(id){if(!SB||!CLOUD_USER)return;try{await SB.storage.from('receipts').remove(['shared/'+id])}catch(e){}}
async function cloudMigrateLocalAttachments(){if(!SB||!CLOUD_USER)return;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith('fatt_')){const v=localStorage.getItem(k);if(v)cloudUploadAttachment(k.slice(5),v)}}}catch(e){}}
function b64ToU8(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function ensurePushSubscription(){if(!SB||!CLOUD_USER||!notifOK()||localStorage.getItem('pwa_notify')!=='1')return;try{const {data:keyData,error:keyErr}=await SB.functions.invoke('push-notify',{body:{mode:'vapid-key'}});if(keyErr)throw keyErr;const vapid=String(keyData?.publicKey||'');if(!vapid)return;const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription(),prev=localStorage.getItem('vapid_public_key')||'';if(sub&&prev&&prev!==vapid){try{await sub.unsubscribe()}catch(e){}sub=null}if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(vapid)});localStorage.setItem('vapid_public_key',vapid);const j=sub.toJSON();await SB.from('push_subscriptions').upsert({user_id:CLOUD_USER.id,endpoint:j.endpoint,p256dh:j.keys?.p256dh,auth:j.keys?.auth,device_id:DEVICE_ID,user_agent:navigator.userAgent,updated_at:new Date().toISOString()},{onConflict:'user_id,endpoint'})}catch(e){console.warn('Push subscription:',e)}}
async function notifyActivity(kind,o){const title=kind==='commitment'?'Novo compromisso':'Novo lançamento financeiro',body=kind==='commitment'?`${o.t} · ${fdy(o.d)}${o.h?' às '+o.h:''}`:`${o.type==='out'?'Despesa':'Receita'} · ${o.desc} · ${brl(o.val)} · ${walletLabel(o)}`;try{const {error}=await SB.functions.invoke('push-notify',{body:{mode:'broadcast',kind,title,body,url:kind==='commitment'?'./?tab=agenda':'./?tab=home'}});if(error)throw error}catch(e){if(notifOK())notify(title,body,'activity-'+Date.now(),{url:kind==='commitment'?'./?tab=agenda':'./?tab=home'})}}

let pwaInstallPrompt=null,toastTimer=null;

async function installApp(){if(isStandalone()){toast('O app já está instalado.');return}if(pwaInstallPrompt){pwaInstallPrompt.prompt();const r=await pwaInstallPrompt.userChoice;if(r.outcome==='accepted')toast('Instalação iniciada.');pwaInstallPrompt=null;return}if(isIOS()){M(`<h2>Instalar no iPhone / iPad</h2><div style="font-size:15px;line-height:1.55">1. Toque em <b>Compartilhar</b> no navegador.<br>2. Escolha <b>Adicionar à Tela de Início</b>.<br>3. Abra o app pelo novo ícone.<br><br><span class="mu">Depois de instalado, volte em Mais → Ativar avisos.</span></div>${btns().replace('Cancelar','Fechar')}`);return}M(`<h2>Instalar aplicativo</h2><div class="mu">Abra o menu do navegador e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>. No Chrome para Android, o botão de instalação costuma aparecer automaticamente.</div>${btns().replace('Cancelar','Fechar')}`)}

async function enableNotifications(){if(!('Notification'in window)){toast('Notificações não são suportadas neste navegador.');return}if(isIOS()&&!isStandalone()){M(`<h2>Primeiro instale o app</h2><div class="mu">No iPhone/iPad, adicione este site à Tela de Início e abra pelo ícone antes de ativar notificações.</div><button class="pri" onclick="closeM();installApp()">Ver como instalar</button>${btns()}`);return}try{const p=await Notification.requestPermission();if(p!=='granted'){toast(p==='denied'?'Notificações bloqueadas nas configurações.':'Permissão não concedida.');if(tab==='mais')render();return}localStorage.setItem('pwa_notify','1');toast('Notificações ativadas.');await ensurePushSubscription();await testNotification(1);if(tab==='mais')render()}catch(e){toast('Não foi possível ativar as notificações.')}}
async function notify(title,body,tag='casa-obra',data={}){if(!notifOK())return false;try{const r=await navigator.serviceWorker.ready;await r.showNotification(title,{body,icon:'./icons/icon-192.png',badge:'./icons/badge-96.png',tag,data,renotify:false});return true}catch(e){try{new Notification(title,{body,icon:'./icons/icon-192.png',tag});return true}catch(x){return false}}}
async function testNotification(silent){if(!notifOK()){if(!silent)return enableNotifications();return}const ok=await notify('Casa & Obra','Notificações estão funcionando neste aparelho.','test',{url:'./?tab=home'});if(!silent)toast(ok?'Notificação enviada.':'Não foi possível enviar o teste.')}
async function dailyReminders(){if(!notifOK()||localStorage.getItem('pwa_notify')!=='1')return;const key='notify_day_'+TD;if(localStorage.getItem(key))return;const today=events(TD,TD).filter(e=>e.type==='out'&&!S.pd[pdk(e)]),tom=events(addD(TD,1),addD(TD,1)).filter(e=>e.type==='out'&&!S.pd[pdk(e)]),ag=S.ev.filter(e=>e.d===TD);let bits=[];if(today.length)bits.push(`${today.length} ${today.length>1?'contas vencem':'conta vence'} hoje (${brl(sum(today))})`);if(tom.length)bits.push(`${tom.length} ${tom.length>1?'contas vencem':'conta vence'} amanhã (${brl(sum(tom))})`);if(ag.length)bits.push(`${ag.length} ${ag.length>1?'compromissos':'compromisso'} na agenda hoje`);if(bits.length){await notify('Resumo do dia',bits.join(' · '),'daily-'+TD,{url:'./?tab=home'});try{navigator.setAppBadge?.(today.length+ag.length)}catch(e){}}else{try{navigator.clearAppBadge?.()}catch(e){}}localStorage.setItem(key,'1');Object.keys(localStorage).filter(k=>k.startsWith('notify_day_')&&k!=='notify_day_'+TD).forEach(k=>localStorage.removeItem(k))}

function setTheme(){const r=document.documentElement,c=r.getAttribute('data-theme');if(!c){r.setAttribute('data-theme','light');localStorage.setItem('ui_theme','light');toast('Tema claro.')}else if(c==='light'){r.setAttribute('data-theme','dark');localStorage.setItem('ui_theme','dark');toast('Tema escuro.')}else{r.removeAttribute('data-theme');localStorage.removeItem('ui_theme');toast('Tema automático.')}if(tab==='mais')render()}

async function exportBackup(){try{const txt=JSON.stringify(backupPayload());const blob=new Blob([txt],{type:'application/json'}),file=new File([blob],`casa-obra-backup-${TD}.json`,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Backup Casa & Obra',files:[file]});toast('Backup pronto para salvar ou compartilhar.');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup exportado.')}catch(e){if(e.name!=='AbortError')toast('Não foi possível exportar o backup.')}}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const b=JSON.parse(await f.text());if(!b||!b.fin||!Array.isArray(b.fin.tx))throw new Error('invalid');M(`<h2>Restaurar backup?</h2><div class="mu">O arquivo é de <b>${esc(b.app||'Casa & Obra')}</b>${b.exportedAt?' · '+new Date(b.exportedAt).toLocaleString('pt-BR'):''}. A restauração substituirá os dados atuais deste aparelho.</div><button class="pri" onclick="applyBackup()">Restaurar agora</button>${btns()}`);md.backup=b}catch(e){toast('Arquivo de backup inválido.')}};i.click()}
function applyBackup(){const b=md.backup;if(!b?.fin)return;S=Object.assign({tx:[],budget:0,obraIni:0,obraDt:'',acc:[],rec:[],pd:{},alog:[],ev:[],vr:[],vlog:[]},b.fin);save();try{Object.keys(localStorage).filter(k=>k.startsWith('fatt_')).forEach(k=>localStorage.removeItem(k));Object.entries(b.attachments||{}).forEach(([k,v])=>localStorage.setItem(k,v));if(b.settings?.ui_theme)localStorage.setItem('ui_theme',b.settings.ui_theme)}catch(e){}closeM();restoreTheme();cloudMigrateLocalAttachments();render();toast('Backup restaurado com sucesso.')}
function showInternalOverlay(title,message,action){M(`<h2>${esc(title)}</h2><div style="line-height:1.5">${esc(message)}</div>${action?`<button class="pri" onclick="${action};closeM()">Abrir</button>`:''}${btns().replace('Cancelar','Fechar')}`)}
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};

<script>
(async()=>{
  try{
    const names=['v5-0.js','v5-1.js','v5-2.js','v5-3.js','v5-4.js','v5-extra.js'];
    const parts=await Promise.all(names.map(async name=>{
      const r=await fetch('./'+name,{cache:'no-store'});
      if(!r.ok)throw new Error(name+' HTTP '+r.status);
      return await r.text();
    }));
    const u=URL.createObjectURL(new Blob([parts.join('')],{type:'text/javascript'}));
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=u;
      s.onload=()=>{URL.revokeObjectURL(u);resolve()};
      s.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('Falha ao executar V5'))};
      document.head.appendChild(s);
    });
  }catch(e){console.error('Casa & Obra V5:',e)}
  vrTick();
  bootstrapApp();
})();
</script>
